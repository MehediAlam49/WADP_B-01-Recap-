{% extends 'master/base.html' %}

{% block content %}
<h2>Teacher View</h2>
  <div class="card" style="width: 18rem;">
    <div class="card-body">
      <h5 class="card-title">Name: {{teacher.name}}</h5>
      <h6 class="card-subtitle mb-2 text-body-secondary">Address: {{teacher.address}}</h6>
      <p class="card-text">Age: {{teacher.age}}</p>
      <p class="card-text">Phone: {{teacher.phone}}</p>
      
    </div>
  </div>
{% endblock %}
