{% extends 'master/base.html' %}

{% block content %}
<h1>Edit Teacher</h1>
  <form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    <div class="mb-3">
      <label for="exampleInputEmail1" class="form-label">Name</label>
      <input type="text" class="form-control" id="exampleInputEmail1" value="{{teacher.name}}" name="name" aria-describedby="emailHelp" />
    </div>
    <div class="mb-3">
      <label for="exampleInputEmail1" class="form-label">Address</label>
      <input type="text" class="form-control" id="exampleInputEmail1" value="{{teacher.address}}" name="address" aria-describedby="emailHelp" />
    </div>
    <div class="mb-3">
      <label for="exampleInputEmail1" class="form-label">Age</label>
      <input type="number" class="form-control" id="exampleInputEmail1" value="{{teacher.age}}" name="age" aria-describedby="emailHelp" />
    </div>
    <div class="mb-3">
      <label for="exampleInputEmail1" class="form-label">Phone</label>
      <input type="number" class="form-control" id="exampleInputEmail1" value="{{teacher.phone}}" name="phone" aria-describedby="emailHelp" />
    </div>
    
    <button type="submit" class="btn btn-primary">Update</button>
  </form>
{% endblock %}
